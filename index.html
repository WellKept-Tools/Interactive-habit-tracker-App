function validState(v){if(!v||typeof v!=='object'||v.version!==2||!Array.isArray(v.habits)||!v.records||Array.isArray(v.records))throw Error('Invalid backup');if(v.habits.length>5000||JSON.stringify(v).length>18000000)throw Error('Backup too large');const ids=new Set();v.habits.forEach(h=>{if(!h.id||ids.has(h.id)||typeof h.name!=='string'||!Number.isFinite(+h.target)||h.target<=0||!/^\d{4}-\d{2}-\d{2}$/.test(h.start))throw Error('Invalid habit');ids.add(h.id)});Object.entries(v.records).forEach(([d,r])=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!r||typeof r!=='object')throw Error('Invalid date');Object.values(r).forEach(n=>{if(!Number.isFinite(n)||n<0)throw Error('Invalid progress')})});if(v.habits.length>5||v.tasks?.length>5)throw Error('Demo limit');return {...defaults(),...v,settings:{...defaults().settings,...v.settings},profile:{...defaults().profile,...v.profile}}}

async function persist(){S.revision=Date.now();let ok=false;try{localStorage.setItem(KEY,JSON.stringify(S));ok=true}catch{}if(db)try{await new Promise((resolve,reject)=>{let tx=db.transaction('state','readwrite');tx.objectStore('state').put(S,'current');tx.oncomplete=resolve;tx.onerror=reject});ok=true}catch{}storageOK=ok;if(!ok)toast(t('Local storage is unavailable. Keep this page open and export a backup.'))}
function value(h,d=selected){return Number(S.records[d]?.[h.id])||0}function target(h){return Math.max(.01,Number(h.target)||1)}function complete(h,d=selected){return value(h,d)>=target(h)}function scheduled(d=selected){return S.habits.filter(h=>due(h,d))}function rate(d=selected,cat){let hs=scheduled(d).filter(h=>!cat||h.category===cat);return hs.length?Math.round(hs.reduce((a,h)=>a+Math.min(1,value(h,d)/target(h)),0)/hs.length*100):0}function doneCount(d=selected){return scheduled(d).filter(h=>complete(h,d)).length}
function streak(h=null){let start=TODAY();const eligible=d=>h?due(h,d):scheduled(d).length>0;const good=d=>h?complete(h,d):scheduled(d).length>0&&doneCount(d)===scheduled(d).length;let current=0,longest=0,run=0,misses=0;for(let i=0;i<3660;i++){let d=shift(start,-i);if(d<S.created&&(!h||d<h.start))break;if(!eligible(d))continue;if(good(d)){if(!misses)current++;run++}else{if(i!==0)misses++;longest=Math.max(longest,run);run=0;if(i===0)continue}}return {current,longest:Math.max(current,longest,run)}}
